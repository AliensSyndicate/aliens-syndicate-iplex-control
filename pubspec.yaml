name: aliens_syndicate_iplex_control
description: "iPlex — administration for the iPlex ecosystem."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  cloud_functions: ^7.0.0
  firebase_app_check: ^0.5.0
  firebase_crashlytics: ^6.0.0
  firebase_analytics: ^13.0.0
  google_sign_in: ^7.2.0
  hugeicons: ^1.2.0
  intl: ^0.20.3
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  url_launcher: ^6.3.3
  flutter_localizations:
    sdk: flutter
  file_picker: ^13.1.0
  crypto: ^3.0.7
  webview_flutter: ^4.14.1
  firebase_messaging: ^17.0.0
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.4
  http: ^1.6.0
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  webview_flutter_platform_interface: ^2.15.1
  shared_preferences_platform_interface: ^2.4.2

flutter:
  config:
    enable-swift-package-manager: false

  uses-material-design: true
  generate: true

  assets:
    - assets/images/

flutter_launcher_icons:  # flutter clean && flutter pub get && dart run flutter_launcher_icons
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/app.png"
  min_sdk_android: 21

flutter_native_splash: # dart run flutter_native_splash:create
  color: "#121212"
  color_dark: "#121212"
  image: "assets/images/launcher.png"
  image_dark: "assets/images/launcher.png"
  android_12:
    color: "#121212"
    color_dark: "#121212"
    image: "assets/images/splash_android12.png"
    image_dark: "assets/images/splash_android12.png"

